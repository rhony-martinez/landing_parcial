<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Piedrazul</title>
    <link rel="stylesheet" href="estilos/styles.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body>
    
    <!--Encabezado de la página-->
    <header> 
        <div class="container-fluid">
            <div class="align-items-center">
                <div class="profile-info">
                    <h1>Clínica Piedrazul</h1>
                    <h3>Atención médica confiable, cercana y especializada para cuidar tu salud.</h3>
                    <p class="d-none d-md-block">Consulta la información de los médicos, conozcan sus especialidades y puedan agendar citas de manera rápida y sencilla.</p>
                
                </div>
            </div> 
        </div>
    </header>

    <!--Barra de navegación-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#seccion1">Sección 1</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#seccion2">Sección 2</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#seccion3">Sección 3</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#seccion4">Sección 4</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!--Sección 1-->
    <div class="container-fluid mt-5" id="seccion1">
        <h1>Nuestras promos</h1>   
        <!-- Carrusel -->
        <div id="carouselProductos" class="carousel slide mb-4" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="assets/promo_audio.jpg" class="d-block w-100" alt="Promo 1">
                </div>
                <div class="carousel-item">
                    <img src="assets/promo_cardio.jpg" class="d-block w-100" alt="Promo 2">
                </div>
                <div class="carousel-item">
                    <img src="assets/promo_fisio.jpg" class="d-block w-100" alt="Promo 3">
                </div>
            </div>
            <!-- Controles del carrusel -->
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselProductos" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselProductos" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>   
    </div>

</body>
</html>
